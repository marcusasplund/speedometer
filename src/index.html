<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>speedo</title>
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="speedometer | offline">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta content="black-translucent" name="apple-mobile-web-app-status-bar-style">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./favicon-32x32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="./favicon-16x16.png" sizes="16x16">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#111110">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="instrument">
    <header><h1>speedo<span> / </span></h1><span class="gps" id="status" role="status" data-state="idle">GPS off</span></header>
    <div class="dial" aria-label="Speedometer">
      <svg viewBox="0 0 500 500" aria-hidden="true">
        <circle class="rim" cx="250" cy="250" r="242" />
        <circle class="inner-rim" cx="250" cy="250" r="232" />
        <g id="ticks"></g>
        <g id="needle"><path class="needle" d="M247 270 L248.5 64 Q250 57 251.5 64 L253 270Z"/><circle class="hub" cx="250" cy="250" r="12"/><circle class="hub-center" cx="250" cy="250" r="4"/></g>
      </svg>
      <div class="readout"><span id="speed">—</span><span id="unit">km/h</span></div>
      <div id="altitudeEl" class="altitude" role="group" aria-label="Altitude above sea level" hidden>
        <span class="altitude-label">alt</span>
        <output id="altitude" aria-label="Altitude">—</output>
        <select id="altitudeUnit" aria-label="Altitude unit"><option value="1">m</option><option value="3.28084">ft</option></select>
      </div>
    </div>
    <div class="drive-controls"><button id="start" type="button">Start GPS</button></div>
    <section class="settings" aria-label="Instrument settings">
      <label><select id="vehicle" aria-label="Vehicle"><option value="auto">Auto</option><option value="0">Bicycle</option><option value="1">Moped</option><option value="2">Car</option><option value="3">Aircraft</option></select></label>
      <label><select id="speedUnit" aria-label="Speed unit"><option value="0">km/h</option><option value="1">knots</option><option value="2">mph</option><option value="3">m/s</option></select></label>
      <label class="altitude-toggle"><input type="checkbox" id="showAltitude"> alt</label>
    </section>
  </main>
  <script src="./index.js" defer></script>
  <script>
  // TODO: remove hacky hack https://github.com/parcel-bundler/parcel/issues/2080
  if ('serviceWorker' in navigator) {
    const x = 'service-worker.js'
    navigator.serviceWorker.register(x)
      .then(function(registration) {
        console.log('Registration successful, scope is:', registration.scope)
    })
      .catch(function(error) {
         console.log('Service worker registration failed, error:', error)
    })
  }
  </script>
  <script>
  (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
  (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
  m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
  })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');
  ga('create', 'UA-28240591-1', 'auto');
  ga('send', 'pageview');
</script>
</body>
</html>
